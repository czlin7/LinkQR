<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkQR</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <!-- Main Container for Popup Content -->
  <div class="popup-body">
    <!-- Top Section: Title and Buttons -->
    <div class="top-group">
      <span class="top-spacer" aria-hidden="true"></span>

      <!-- Title Section -->
      <p id="title">
        <!-- Localized Title Content -->
        <span data-locale="popup_title">Scan QR code</span>
      </p>

      <!-- Open in New Tab Button -->
      <button class="newTab-btn" id="logButton" type="button"
        title="Open QR code in a new tab" aria-label="Open QR code in a new tab">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-app-window">
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="M2 8h20" />
        </svg>
      </button>
    </div>

    <!-- QR Code Display Section -->
    <div class="qr shadows-1"></div>

    <!-- Input Field for QR Text -->
    <input class="inputbar" type="text" placeholder="URL" id="inputbar"
      aria-label="QR code URL" autocomplete="off" spellcheck="false">

    <!-- Button Group for Actions -->
    <div id="btn-group">
      <!-- Dropdown for Download Format -->
      <div class="dropdown-container" role="group" aria-label="Download QR code">
        <!-- Default Button -->
        <button class="download-button" type="button" aria-label="Download QR code as PNG">PNG</button>

        <!-- Dropdown Icon -->
        <button class="selector" type="button" aria-label="Choose download format"
          aria-haspopup="menu" aria-expanded="false" aria-controls="download-format-menu">
          <span class="selector-icon" aria-hidden="true">&#9660;</span>
        </button>

        <!-- Dropdown Menu -->
        <div class="dropdown-menu shadows-1" id="download-format-menu" role="menu" aria-label="Download format">
          <!-- PNG Format Option -->
          <button class="dropdown-item" type="button" role="menuitemradio"
            aria-checked="true" data-format="png">PNG</button>
          <!-- SVG Format Option -->
          <button class="dropdown-item" type="button" role="menuitemradio"
            aria-checked="false" data-format="svg">SVG</button>
        </div>
      </div>

      <!-- Copy Button -->
      <button class="buttonCopy" type="button" title="Copy QR code as PNG" aria-label="Copy QR code as PNG">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"
          class="copy-icon">
          <g clip-path="url(#clip0_8_59)">
            <path
              d="M2.41667 6.33333V13C2.41667 13.598 2.90201 14.0833 3.50001 14.0833H8.83334C9.43134 14.0833 9.91667 13.598 9.91667 13V6.33333C9.91667 5.73533 9.43134 5.25 8.83334 5.25H3.50001C2.90201 5.25 2.41667 5.73533 2.41667 6.33333Z"
              stroke="currentColor" stroke-width="1" stroke-miterlimit="10" stroke-linejoin="round" />
            <path
              d="M11.5 11.4167C12.098 11.4167 12.5833 10.9313 12.5833 10.3333V3.66667C12.5833 3.06867 12.098 2.58333 11.5 2.58333H6.16666C5.56866 2.58333 5.08333 3.06867 5.08333 3.66667"
              stroke="currentColor" stroke-width="1" stroke-miterlimit="10" stroke-linejoin="round" />
          </g>
          <defs>
            <clipPath id="clip0_8_59">
              <rect width="16" height="16" fill="white" />
            </clipPath>
          </defs>
        </svg>
        <span id="message" role="status" aria-live="polite" aria-atomic="true">
          <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"
            stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"
            class="success-icon">
            <path fill="currentColor" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18" />
            <path stroke="#fff" d="m9 12 2 2 4-4" />
          </svg>
          <span class="visually-hidden">QR image copied</span>
        </span>
      </button>
    </div>
  </div>

  <!-- JavaScript Files -->
  <script src="../common/url.js"></script>
  <script src="qrcode.min.js"></script>
  <script src="popup.js"></script>
  <script src="moveToNewTab.js"></script>
  <script src="script.js"></script>
</body>

</html>
